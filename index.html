<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Composer</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cc785c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MailComposer">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0e11;
      --surface: #16181d;
      --surface2: #1e2028;
      --border: #2a2d38;
      --accent: #cc785c;
      --accent2: #d4956a;
      --text: #e8e9ec;
      --muted: #6b7080;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    input,
    textarea,
    .rich {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      -webkit-text-size-adjust: 100%;
    }

    input:focus,
    textarea:focus,
    .rich:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    #subject-input {
      min-height: 52px;
    }

    .rich {
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-y: auto;
      min-height: 180px;
    }

    button {
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.8rem 2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent2);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>✉ Mail Composer</h1>
    <div class="divider"></div>

    <div class="row">
      <input id="email-input" type="email" placeholder="To — hr@company.com" oninput="parseEmail(this.value)">
      <input id="position" type="text" placeholder="Position" oninput="refreshAll()">
    </div>
    <div class="row">
      <input id="hr-name" type="text" placeholder="HR Name" oninput="refreshAll()">
      <input id="company" type="text" placeholder="Company" oninput="refreshAll()">
    </div>

    <h2>Email</h2>
    <textarea id="subject-input" rows="2" oninput="syncTpl('subject', this)"></textarea>
    <div id="body-input" class="rich" contenteditable="true" oninput="syncTpl('body', this)"></div>
    <div class="row">
      <button id="copy-email-btn" onclick="copyRich('body-input', 'copy-email-btn')">Copy Body</button>
      <button onclick="openMail()">Open in Mail App →</button>
    </div>

    <div class="divider"></div>

    <h2>LinkedIn</h2>
    <div id="li-input" class="rich" contenteditable="true" oninput="syncTpl('li', this)"></div>
    <div class="row">
      <button id="copy-li-btn" onclick="copyRich('li-input', 'copy-li-btn')">Copy Message</button>
      <button onclick="openLinkedIn()">Open LinkedIn →</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const TPL = {
      subject: `Application for {position} Position at {company}`,
      body:
        `Dear {hrName},

    I hope this message finds you well. I am writing to express my interest in joining {company} as a {position}. (Bold test: {hrName}, {company}, and {position} will appear bold when copied.)

With hands-on experience in building scalable web applications and a passion for clean, efficient code, I believe I can contribute meaningfully to {company}'s engineering team.

I would love the opportunity to discuss how my background aligns with your needs.

Thank you for your time, {hrName}. Looking forward to hearing from you.

Warm regards,
Brijesh`,
      li:
        `Hi {hrName},

I came across {company} and was genuinely impressed by the work your team is doing. I'm a {position} with experience in building scalable web applications and would love to explore any opportunities at {company}.

Would you be open to a quick connect? I'd appreciate any guidance you can offer.

Thanks,
Brijesh`
    };

    const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
    const val = id => document.getElementById(id).value;

    function parseEmail(email) {
      const [local, domain] = email.split('@');
      if (!domain) return;
      const company = cap(domain.split('.')[0]);
      document.getElementById('company').value = company;
      document.getElementById('hr-name').value = /^(hr|info|careers|jobs|recruit|talent)$/i.test(local)
        ? company + ' Team'
        : local.split(/[._-]/).map(cap).join(' ');
      refreshAll();
    }

    function toHtml(tpl) {
      const hr = val('hr-name') || '{hrName}';
      const co = val('company') || '{company}';
      const po = val('position') || '{position}';

      return tpl
        .replaceAll('{hrName}', hr)
        .replaceAll('{company}', co)
        .replaceAll('{position}', po)
        .replaceAll(hr, `<strong>${hr}</strong>`)
        .replaceAll(co, `<strong>${co}</strong>`)
        .replaceAll(po, `<strong>${po}</strong>`)
        .replace(/\n/g, '<br>');
    }

    function refreshAll() {
      const hr = val('hr-name') || '{hrName}', co = val('company') || '{company}', po = val('position') || '{position}';
      document.getElementById('subject-input').value = TPL.subject
        .replaceAll('{hrName}', hr).replaceAll('{company}', co).replaceAll('{position}', po);
      document.getElementById('body-input').innerHTML = toHtml(TPL.body);
      document.getElementById('li-input').innerHTML = toHtml(TPL.li);
    }

    function syncTpl(key, el) {
      const hr = val('hr-name') || '{hrName}', co = val('company') || '{company}', po = val('position') || '{position}';
      const plain = (el.innerText ?? el.value).replace(/\r/g, '');
      TPL[key] = plain
        .replaceAll(hr, '{hrName}')
        .replaceAll(co, '{company}')
        .replaceAll(po, '{position}');
    }

    function copyRich(srcId, btnId) {
      const html = document.getElementById(srcId).innerHTML;
      navigator.clipboard.write([
        new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }) })
      ]).then(() => {
        const btn = document.getElementById(btnId);
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
      });
    }

    function openMail() {
      const to = val('email-input'), subject = val('subject-input');
      // body excluded — use "Copy Body" then paste for bold formatting
      // &body=${encodeURIComponent(document.getElementById('body-input').innerText)}
      window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}`;
    }

    function openLinkedIn() {
      window.open('https://www.linkedin.com/messaging/', '_blank');
    }

    refreshAll();
  </script>
</body>

</html>
