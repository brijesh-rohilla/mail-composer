<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Composer</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cc785c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MailComposer">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&family=Roboto:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0e11;
      --surface: #16181d;
      --surface2: #1e2028;
      --border: #2a2d38;
      --accent: #cc785c;
      --accent2: #d4956a;
      --text: #e8e9ec;
      --muted: #6b7080;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 640px) {
      .input-row {
        grid-template-columns: 1fr;
      }
    }

    input,
    textarea,
    .rich {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      -webkit-text-size-adjust: 100%;
    }

    input:focus,
    textarea:focus,
    .rich:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    #subject-input {
      min-height: 52px;
    }

    .rich {
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-y: auto;
      min-height: 180px;
    }

    #body-input {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    #li-input {
      font-family: 'Source Sans 3', 'Source Sans Pro', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.4rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent2);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>✉ Mail Composer</h1>
    <div class="divider"></div>

    <div class="row input-row">
      <input id="email-input" type="email" placeholder="To — hr@company.com" oninput="parseEmail(this.value)">
      <input id="position" type="text" placeholder="Position" value="MERN Stack Developer" oninput="refreshAll()">
    </div>
    <div class="row input-row">
      <input id="hr-name" type="text" placeholder="HR Name" oninput="refreshAll()">
      <input id="company" type="text" placeholder="Company" oninput="refreshAll()">
    </div>

    <h2>Email</h2>
    <textarea id="subject-input" rows="2" oninput="syncTpl('subject', this)"></textarea>
    <div id="body-input" class="rich" contenteditable="true" oninput="syncTpl('body', this)"></div>
    <div class="row">
      <button id="copy-email-btn" onclick="copyRich('body-input', 'copy-email-btn')">Copy</button>
      <button onclick="openMail()">Mail App →</button>
    </div>

    <div class="divider"></div>

    <h2>LinkedIn</h2>
    <div id="li-input" class="rich" contenteditable="true" oninput="syncTpl('li', this)"></div>
    <div class="row">
      <button id="copy-li-btn" onclick="copyRich('li-input', 'copy-li-btn')">Copy</button>
      <button onclick="openLinkedIn()">LinkedIn →</button>
    </div>
  </div>

  <script src="./tpl.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const PLACEHOLDERS = {
      hrName: '{hrName}',
      company: '{company}',
      position: '{position}'
    };

    const TPL = window.TPL;
    const BOLD_FLAG = '__BOLD__';
    const HR_ALIAS_RE = /^(hr|info|careers|jobs|recruit|talent)$/i;

    const EL = {
      email: document.getElementById('email-input'),
      position: document.getElementById('position'),
      hrName: document.getElementById('hr-name'),
      company: document.getElementById('company'),
      subject: document.getElementById('subject-input'),
      body: document.getElementById('body-input'),
      li: document.getElementById('li-input')
    };

    const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';

    function getTokens() {
      return {
        hrName: EL.hrName.value || PLACEHOLDERS.hrName,
        company: EL.company.value || PLACEHOLDERS.company,
        position: EL.position.value || PLACEHOLDERS.position
      };
    }

    function applyTokens(text, tokens) {
      return text
        .replaceAll(`{${BOLD_FLAG}hrName}`, tokens.hrName)
        .replaceAll(`{${BOLD_FLAG}company}`, tokens.company)
        .replaceAll(`{${BOLD_FLAG}position}`, tokens.position)
        .replaceAll(PLACEHOLDERS.hrName, tokens.hrName)
        .replaceAll(PLACEHOLDERS.company, tokens.company)
        .replaceAll(PLACEHOLDERS.position, tokens.position);
    }

    function applyTokensToHtml(text, tokens) {
      return text
        .replaceAll(`{${BOLD_FLAG}hrName}`, `<strong>${tokens.hrName}</strong>`)
        .replaceAll(`{${BOLD_FLAG}company}`, `<strong>${tokens.company}</strong>`)
        .replaceAll(`{${BOLD_FLAG}position}`, `<strong>${tokens.position}</strong>`)
        .replaceAll(PLACEHOLDERS.hrName, tokens.hrName)
        .replaceAll(PLACEHOLDERS.company, tokens.company)
        .replaceAll(PLACEHOLDERS.position, tokens.position);
    }

    function parseEmail(email) {
      const [local, domain] = email.split('@');
      if (!domain) return;
      const company = cap(domain.split('.')[0]);
      EL.company.value = company;
      EL.hrName.value = HR_ALIAS_RE.test(local)
        ? company + ' Team'
        : local.split(/[._-]/).map(cap).join(' ') + ` ma'am`;
      refreshAll();
    }

    function toHtml(tpl) {
      const tokens = getTokens();

      return applyTokensToHtml(tpl, tokens)
        .replace(/\n/g, '<br>');
    }

    function refreshAll() {
      const tokens = getTokens();
      EL.subject.value = applyTokens(TPL.subject, tokens);
      EL.body.innerHTML = toHtml(TPL.body);
      EL.li.innerHTML = toHtml(TPL.li);
    }

    function syncTpl(key, el) {
      const tokens = getTokens();
      const plain = (el.innerText ?? el.value).replace(/\r/g, '');
      TPL[key] = plain
        .replaceAll(tokens.hrName, PLACEHOLDERS.hrName)
        .replaceAll(tokens.company, PLACEHOLDERS.company)
        .replaceAll(tokens.position, PLACEHOLDERS.position);
    }

    function flashCopyState(btnId, text) {
      const btn = document.getElementById(btnId);
      const orig = btn.textContent;
      btn.textContent = text;
      setTimeout(() => btn.textContent = orig, 1600);
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);

      // iOS Safari copy works more reliably with explicit range + selection.
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (_) {
        copied = false;
      }

      document.body.removeChild(ta);
      return copied;
    }

    async function copyRich(srcId, btnId) {
      const node = document.getElementById(srcId);
      const html = node.innerHTML;
      const text = node.innerText;

      try {
        if (window.ClipboardItem && navigator.clipboard?.write) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], { type: 'text/html' }),
              'text/plain': new Blob([text], { type: 'text/plain' })
            })
          ]);
          flashCopyState(btnId, 'Copied!');
          return;
        }

        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          flashCopyState(btnId, 'Copied!');
          return;
        }
      } catch (_) {
        // If secure-context clipboard APIs fail, fall through to selection copy.
      }

      if (fallbackCopyText(text)) {
        flashCopyState(btnId, 'Copied!');
      } else {
        flashCopyState(btnId, 'Copy failed');
      }
    }

    function openMail() {
      const to = EL.email.value;
      const subject = EL.subject.value;
      // body excluded — use "Copy Body" then paste for bold formatting
      // &body=${encodeURIComponent(document.getElementById('body-input').innerText)}
      window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}`;
    }

    function openLinkedIn() {
      window.open('https://www.linkedin.com/messaging/', '_blank');
    }

    refreshAll();
  </script>
</body>

</html>
